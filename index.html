<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f4f5f1">
	<title>중구 CCTV 위치 탐색</title>
	<link rel="preconnect" href="https://unpkg.com">
	<link rel="preconnect" href="https://tile.openstreetmap.org">
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
	<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
	<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
	<style>
		:root { color-scheme: light; --ink:#202c2b; --muted:#71807c; --line:#e1e6df; --paper:#f4f5f1; --white:#fff; --accent:#df5d42; --accent-pale:#fff0e9; --green:#357768; font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; font-synthesis:none; }
		* { box-sizing:border-box; }
		html,body { width:100%; height:100%; margin:0; }
		body { color:var(--ink); background:var(--paper); }
		button,input { font:inherit; }
		button { color:inherit; }
		.app { display:flex; flex-direction:column; width:100%; height:100%; min-height:480px; }
		.topbar { z-index:500; display:flex; align-items:center; justify-content:space-between; min-height:70px; padding:0 26px; background:var(--white); border-bottom:1px solid var(--line); }
		.brand { display:flex; align-items:center; gap:12px; min-width:0; }
		.brand-mark { display:grid; width:36px; height:36px; place-items:center; border-radius:11px; background:var(--ink); color:white; }
		.brand-mark svg { width:19px; height:19px; }
		.brand-copy { display:flex; align-items:baseline; gap:10px; min-width:0; }
		h1 { margin:0; font-size:17px; line-height:1.2; font-weight:750; letter-spacing:0; white-space:nowrap; }
		.brand-subtitle { color:var(--muted); font-size:12px; white-space:nowrap; }
		.topbar-meta { display:flex; align-items:center; gap:16px; color:var(--muted); font-size:12px; }
		.live-label { display:inline-flex; align-items:center; gap:7px; color:var(--green); font-weight:700; }
		.live-dot { width:7px; height:7px; border-radius:50%; background:#55a189; box-shadow:0 0 0 3px #e5f2ed; }
		.workspace { display:flex; flex:1; min-height:0; }
		.sidebar { z-index:400; display:flex; flex:0 0 355px; flex-direction:column; min-height:0; background:var(--white); border-right:1px solid var(--line); }
		.side-head { padding:25px 22px 19px; }
		.eyebrow { margin:0 0 8px; color:var(--accent); font-size:10px; font-weight:800; letter-spacing:1.2px; }
		.side-heading { display:flex; align-items:end; justify-content:space-between; gap:12px; }
		h2 { margin:0; font-size:22px; line-height:1.25; font-weight:750; letter-spacing:0; }
		.total-count { color:var(--muted); font-size:12px; white-space:nowrap; }
		.total-count strong { color:var(--ink); font-size:20px; font-variant-numeric:tabular-nums; }
		.summary { display:grid; grid-template-columns:1fr 1fr; margin:0 22px 18px; border:1px solid var(--line); border-radius:7px; background:#fafbf8; }
		.summary-item { padding:12px 14px; }
		.summary-item+.summary-item { border-left:1px solid var(--line); }
		.summary-label { display:block; margin-bottom:5px; color:var(--muted); font-size:11px; }
		.summary-value { display:flex; align-items:center; gap:7px; font-size:13px; font-weight:700; }
		.category-dot { width:8px; height:8px; border-radius:50%; background:var(--accent); }
		.search-wrap { position:relative; margin:0 22px 14px; }
		.search-icon { position:absolute; top:50%; left:12px; width:16px; height:16px; color:#83908c; transform:translateY(-50%); pointer-events:none; }
		#search { width:100%; height:42px; padding:0 36px; border:1px solid var(--line); border-radius:5px; outline:none; background:#fafbf9; color:var(--ink); font-size:13px; }
		#search:focus { border-color:#8ba69b; box-shadow:0 0 0 3px #eaf1ed; }
		#search::placeholder { color:#9aa49f; }
		.search-shortcut { position:absolute; top:50%; right:10px; color:#9aa49f; font-size:10px; transform:translateY(-50%); }
		.list-heading { display:flex; align-items:center; justify-content:space-between; min-height:40px; padding:0 22px; border-top:1px solid var(--line); color:var(--muted); font-size:11px; font-weight:650; }
		#visible-count { color:var(--ink); font-variant-numeric:tabular-nums; }
		.camera-list { flex:1; min-height:0; overflow:auto; overscroll-behavior:contain; }
		.camera-row { display:grid; grid-template-columns:28px minmax(0,1fr) 16px; align-items:center; gap:10px; width:100%; min-height:66px; padding:10px 18px 10px 22px; border:0; border-top:1px solid #eff1ed; background:var(--white); text-align:left; cursor:pointer; }
		.camera-row:hover { background:#f8faf7; }
		.camera-row[aria-current="true"] { background:#fff8f4; box-shadow:inset 3px 0 var(--accent); }
		.row-index { display:grid; width:27px; height:27px; place-items:center; border-radius:50%; background:var(--accent-pale); color:#c34e36; font-size:10px; font-weight:750; font-variant-numeric:tabular-nums; }
		.camera-row[aria-current="true"] .row-index { background:var(--accent); color:var(--white); }
		.row-copy { min-width:0; }
		.row-title { overflow:hidden; color:var(--ink); font-size:12px; font-weight:700; text-overflow:ellipsis; white-space:nowrap; }
		.row-address { overflow:hidden; margin-top:4px; color:var(--muted); font-size:11px; text-overflow:ellipsis; white-space:nowrap; }
		.row-arrow { width:14px; height:14px; color:#aab3ae; }
		.empty-state { padding:34px 24px; color:var(--muted); font-size:13px; line-height:1.6; text-align:center; }
		.side-foot { display:flex; align-items:center; justify-content:space-between; min-height:49px; padding:0 18px 0 22px; border-top:1px solid var(--line); color:var(--muted); font-size:10px; }
		.file-button { display:inline-flex; align-items:center; gap:6px; padding:7px 9px; border:1px solid var(--line); border-radius:4px; background:var(--white); color:var(--ink); font-size:11px; font-weight:650; cursor:pointer; }
		.file-button:hover { border-color:#9aaba2; background:#fafbf9; }
		.file-button svg { width:14px; height:14px; }
		#csv-file { display:none; }
		.map-wrap { position:relative; flex:1; min-width:0; background:#e9edeb; }
		#map { position:absolute; inset:0; background:#e9edeb; }
		.map-note { position:absolute; z-index:500; top:15px; right:16px; display:flex; align-items:center; gap:8px; padding:9px 12px; border:1px solid #e4e7e1; border-radius:5px; background:rgba(255,255,255,.96); box-shadow:0 2px 9px #26383214; color:#53625d; font-size:11px; }
		.map-note-mark { width:9px; height:9px; border:2px solid white; border-radius:50%; background:var(--accent); box-shadow:0 0 0 1px var(--accent); }
    .map-tools { position:absolute; z-index:500; right:16px; bottom:170px; display:flex; flex-direction:column; gap:8px; }
		.map-tool { display:grid; width:40px; height:40px; place-items:center; border:1px solid #e1e6df; border-radius:5px; background:white; box-shadow:0 2px 9px #26383214; color:#34413d; cursor:pointer; }
		.map-tool:hover { background:#f8faf7; }
		.map-tool svg { width:18px; height:18px; }
		.status-toast { position:absolute; z-index:600; bottom:27px; left:50%; max-width:calc(100% - 32px); padding:10px 14px; border-radius:5px; background:#24322f; color:white; font-size:12px; text-align:center; transform:translateX(-50%); }
		.status-toast[hidden] { display:none; }
		.custom-cluster { display:grid; place-items:center; border:3px solid rgba(255,255,255,.94); border-radius:50%; background:#304b47; box-shadow:0 1px 5px #17252140; color:#fff; font-size:12px; font-weight:750; font-variant-numeric:tabular-nums; }
		.single-marker { display:block; width:17px; height:17px; border:3px solid white; border-radius:50%; background:var(--accent); box-shadow:0 1px 5px #372c284d,0 0 0 1px #c84e37; }
		.leaflet-popup-content-wrapper { border-radius:6px; }
		.leaflet-popup-content { min-width:195px; margin:14px 16px; }
		.popup-kicker { margin-bottom:5px; color:#c34e36; font-size:10px; font-weight:750; }
		.popup-title { margin-bottom:6px; color:#202c2b; font-size:13px; font-weight:750; }
		.popup-address { color:#71807c; font-size:11px; line-height:1.5; }
		.leaflet-control-attribution { font-size:10px!important; }
		@media (max-width:760px) {
			.app { min-height:560px; }
			.topbar { min-height:60px; padding:0 14px; }
			.brand { gap:9px; }
			.brand-mark { width:32px; height:32px; }
			.brand-copy { display:block; }
			h1 { font-size:15px; }
			.brand-subtitle { display:none; }
			.topbar-meta { gap:8px; font-size:10px; }
			.sidebar { flex-basis:300px; }
			.side-head { padding:18px 16px 14px; }
			.summary { margin:0 16px 14px; }
			.search-wrap { margin:0 16px 12px; }
			.list-heading { padding:0 16px; }
			.camera-row { padding-left:16px; }
			.side-foot { padding-left:16px; }
		}
		@media (max-width:600px) {
			.workspace { flex-direction:column-reverse; }
			.map-wrap { flex:1 1 55%; min-height:230px; }
			.sidebar { flex:1 1 45%; min-height:190px; border-top:1px solid var(--line); border-right:0; }
			.side-head { padding:13px 15px 10px; }
			.eyebrow { margin-bottom:4px; font-size:9px; }
			h2 { font-size:18px; }
			.total-count strong { font-size:17px; }
			.summary-item { padding:7px 10px; }
			.summary-label { margin-bottom:3px; font-size:10px; }
			.summary-value { font-size:11px; }
			.summary { margin:0 15px 10px; }
			.search-wrap { margin:0 15px 8px; }
			#search { height:37px; }
			.list-heading { min-height:31px; padding:0 15px; }
			.camera-row { min-height:55px; padding:7px 12px 7px 15px; }
			.side-foot { min-height:40px; }
			.map-tools { right:10px; bottom:170px; }
			.map-tool { width:36px; height:36px; }
			.map-note { top:10px; right:10px; padding:7px 9px; font-size:10px; }
		}
	</style>
</head>
<body>
	<div class="app">
		<header class="topbar">
			<div class="brand">
				<span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5z"/><path d="m4.5 7.8 7.5 4.4 7.5-4.4M12 12.2V21"/><circle cx="12" cy="8" r="1.4" fill="currentColor" stroke="none"/></svg></span>
				<div class="brand-copy"><h1>중구 CCTV 위치 탐색</h1><span class="brand-subtitle">서울특별시 중구 · 불법주정차 단속</span></div>
			</div>
			<div class="topbar-meta"><span class="live-label"><i class="live-dot"></i>지도 연결됨</span><span>OPENSTREETMAP</span></div>
		</header>
		<main class="workspace">
			<aside class="sidebar" aria-label="CCTV 목록">
				<section class="side-head"><p class="eyebrow">LOCATION INDEX / 01</p><div class="side-heading"><h2>단속 지점</h2><span class="total-count"><strong id="total-count">0</strong>개 지점</span></div></section>
				<section class="summary" aria-label="데이터 요약">
					<div class="summary-item"><span class="summary-label">자치구</span><span class="summary-value" id="district-value">데이터 대기 중</span></div>
					<div class="summary-item"><span class="summary-label">현장 구분</span><span class="summary-value"><i class="category-dot"></i><span id="category-value">불러오는 중</span></span></div>
				</section>
				<label class="search-wrap"><svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4 4"/></svg><input id="search" type="search" placeholder="지점명 또는 주소 검색" autocomplete="off" aria-label="지점명 또는 주소 검색"><span class="search-shortcut">⌘ K</span></label>
				<div class="list-heading"><span>등록된 CCTV</span><span id="visible-count">0건</span></div>
				<div class="camera-list" id="camera-list" role="listbox" aria-label="CCTV 지점 목록"><div class="empty-state">CCTV 데이터를 불러오고 있습니다.</div></div>
				<footer class="side-foot"><span>좌표 기준 · WGS84</span><label class="file-button" for="csv-file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m0 0L8 7m4-4 4 4M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>CSV 다시 불러오기</label><input id="csv-file" type="file" accept=".csv,text/csv"></footer>
			</aside>
			<section class="map-wrap" aria-label="CCTV 위치 지도">
				<div id="map" role="application" aria-label="OpenStreetMap 기반 CCTV 위치 지도"></div>
				<div class="map-note"><i class="map-note-mark"></i><span>개별 지점</span><span>·</span><span>숫자는 묶인 지점 수</span></div>
				<div class="map-tools">
					<button class="map-tool" id="locate-button" type="button" title="내 위치로 이동" aria-label="내 위치로 이동"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2"/></svg></button>
					<button class="map-tool" id="fit-button" type="button" title="전체 지점 보기" aria-label="전체 지점 보기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/><path d="M8 12h8m-4-4v8"/></svg></button>
				</div>
				<div class="status-toast" id="status-toast" role="status" hidden></div>
			</section>
		</main>
	</div>
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
	<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
	<script>
		const map = L.map('map', { zoomControl: false, preferCanvas: true }).setView([37.5652, 126.9897], 14);
		L.control.zoom({ position: 'bottomright' }).addTo(map);
		L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' }).addTo(map);
		const markerLayer = L.markerClusterGroup({
			showCoverageOnHover: false, spiderfyOnMaxZoom: true, disableClusteringAtZoom: 17, maxClusterRadius: 46,
			iconCreateFunction(cluster) {
				const count = cluster.getChildCount();
				const size = count < 10 ? 38 : count < 50 ? 44 : 50;
				return L.divIcon({ html:`<span class="custom-cluster" style="width:${size}px;height:${size}px">${count}</span>`, className:'', iconSize:L.point(size,size) });
			}
		}).addTo(map);
		const state = { records:[], markers:new Map(), activeId:null, toastTimer:null };
		const listElement = document.getElementById('camera-list');
		const searchElement = document.getElementById('search');
		const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[character]);

		function parseCsv(text) {
			const rows = []; let row = []; let cell = ''; let quoted = false;
			for (let index = 0; index < text.length; index += 1) {
				const character = text[index];
				if (quoted) {
					if (character === '"' && text[index + 1] === '"') { cell += '"'; index += 1; }
					else if (character === '"') quoted = false;
					else cell += character;
				} else if (character === '"') quoted = true;
				else if (character === ',') { row.push(cell); cell = ''; }
				else if (character === '\n' || character === '\r') { if (character === '\r' && text[index + 1] === '\n') index += 1; row.push(cell); rows.push(row); row = []; cell = ''; }
				else cell += character;
			}
			if (cell.length || row.length) { row.push(cell); rows.push(row); }
			if (rows.length && rows[0][0]?.charCodeAt(0) === 0xFEFF) rows[0][0] = rows[0][0].slice(1);
			const headers = rows.shift()?.map((header) => header.trim()) ?? [];
			return rows.filter((values) => values.some((value) => value.trim())).map((values, index) => {
				const columns = Object.fromEntries(headers.map((header, column) => [header, (values[column] ?? '').replace(/\s+/g, ' ').trim()]));
				return { id:index, address:columns['고정형CCTV지번주소'] ?? '', lat:Number(columns['위도']), lng:Number(columns['경도']), district:columns['자치구'] ?? '', name:columns['단속지점명'] ?? '', category:columns['현장구분'] ?? '' };
			}).filter((record) => Number.isFinite(record.lat) && Number.isFinite(record.lng) && record.lat >= -90 && record.lat <= 90 && record.lng >= -180 && record.lng <= 180);
		}
		function showToast(message) {
			const toast = document.getElementById('status-toast'); toast.textContent = message; toast.hidden = false;
			clearTimeout(state.toastTimer); state.toastTimer = setTimeout(() => { toast.hidden = true; }, 3800);
		}
		function popupContent(record) {
			return `<div class="popup-kicker">${escapeHtml(record.category || 'CCTV')}</div><div class="popup-title">${escapeHtml(record.name || '지점명 미등록')}</div><div class="popup-address">${escapeHtml(record.address)}<br>${escapeHtml(record.district)} · ${record.lat.toFixed(6)}, ${record.lng.toFixed(6)}</div>`;
		}
		function setActive(record, shouldPan = true) {
			state.activeId = record.id;
			document.querySelectorAll('.camera-row').forEach((element) => { const active = Number(element.dataset.id) === record.id; element.setAttribute('aria-current', active ? 'true' : 'false'); if (active) element.scrollIntoView({ block:'nearest' }); });
			const marker = state.markers.get(record.id);
			if (marker && shouldPan) { map.setView(marker.getLatLng(), Math.max(map.getZoom(), 17), { animate:false }); marker.openPopup(); }
		}
		function renderList() {
			const term = searchElement.value.trim().toLocaleLowerCase('ko');
			const filtered = state.records.filter((record) => `${record.name} ${record.address} ${record.district} ${record.category}`.toLocaleLowerCase('ko').includes(term));
			document.getElementById('visible-count').textContent = `${filtered.length}건`;
			if (!filtered.length) { listElement.innerHTML = '<div class="empty-state">검색 결과가 없습니다.<br>지점명이나 주소를 다시 확인해 주세요.</div>'; return; }
			const fragment = document.createDocumentFragment();
			filtered.forEach((record, index) => {
				const button = document.createElement('button'); button.type = 'button'; button.className = 'camera-row'; button.dataset.id = record.id; button.setAttribute('role','option'); button.setAttribute('aria-current',record.id === state.activeId ? 'true' : 'false');
				button.innerHTML = `<span class="row-index">${String(index+1).padStart(2,'0')}</span><span class="row-copy"><span class="row-title">${escapeHtml(record.name || '지점명 미등록')}</span><span class="row-address">${escapeHtml(record.address)}</span></span><svg class="row-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>`;
				button.addEventListener('click', () => setActive(record)); fragment.append(button);
			});
			listElement.replaceChildren(fragment);
		}
		function renderRecords(records) {
			state.records = records; state.activeId = null; state.markers.clear(); markerLayer.clearLayers();
			const bounds = [];
			records.forEach((record) => {
				const marker = L.marker([record.lat,record.lng], { icon:L.divIcon({ className:'', html:'<span class="single-marker"></span>', iconSize:[17,17], iconAnchor:[8.5,8.5] }) });
				marker.bindPopup(popupContent(record), { closeButton:false, offset:[0,-5] });
				marker.on('click', () => { state.activeId = record.id; document.querySelectorAll('.camera-row').forEach((element) => element.setAttribute('aria-current',Number(element.dataset.id) === record.id ? 'true' : 'false')); });
				markerLayer.addLayer(marker); state.markers.set(record.id,marker); bounds.push([record.lat,record.lng]);
			});
			document.getElementById('total-count').textContent = records.length.toLocaleString('ko-KR');
			document.getElementById('district-value').textContent = records[0]?.district || '확인 필요';
			document.getElementById('category-value').textContent = records[0]?.category || '확인 필요';
			renderList(); if (bounds.length) map.fitBounds(bounds,{ padding:[42,42], maxZoom:15 });
			showToast(`${records.length.toLocaleString('ko-KR')}개 CCTV 위치를 불러왔습니다.`);
		}
		async function loadBundledCsv() {
			try {
				const response = await fetch('./cctv.csv'); if (!response.ok) throw new Error('CSV 파일을 찾을 수 없습니다.');
				const records = parseCsv(new TextDecoder('euc-kr').decode(await response.arrayBuffer()));
				if (!records.length) throw new Error('유효한 좌표가 없습니다.'); renderRecords(records);
			} catch (error) {
				listElement.innerHTML = '<div class="empty-state">CSV 파일을 자동으로 읽지 못했습니다.<br>아래 <strong>CSV 다시 불러오기</strong>를 눌러<br>cctv.csv 파일을 선택해 주세요.</div>';
				document.getElementById('category-value').textContent = '파일 선택 필요'; showToast('cctv.csv를 선택하면 위치를 표시합니다.');
			}
		}
		searchElement.addEventListener('input',renderList);
		document.getElementById('csv-file').addEventListener('change',async (event) => {
			const file = event.target.files?.[0]; if (!file) return;
			try { const records = parseCsv(new TextDecoder('euc-kr').decode(await file.arrayBuffer())); if (!records.length) throw new Error('유효한 좌표가 없습니다.'); renderRecords(records); }
			catch (error) { showToast('CSV 형식이나 좌표를 확인해 주세요.'); }
			event.target.value = '';
		});
		document.getElementById('fit-button').addEventListener('click',() => { if (markerLayer.getLayers().length) map.fitBounds(markerLayer.getBounds(),{ padding:[42,42], maxZoom:15 }); });
		document.getElementById('locate-button').addEventListener('click',() => { map.locate({ setView:true, maxZoom:16 }); map.once('locationerror',() => showToast('현재 위치를 확인할 수 없습니다. 위치 권한을 확인해 주세요.')); });
		map.on('locationfound',(event) => L.circleMarker(event.latlng,{ radius:7, color:'#fff', weight:3, fillColor:'#357768', fillOpacity:1 }).addTo(map).bindPopup('현재 위치').openPopup());
		document.addEventListener('keydown',(event) => { if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') { event.preventDefault(); searchElement.focus(); } if (event.key === 'Escape' && document.activeElement === searchElement) { searchElement.value = ''; renderList(); searchElement.blur(); } });
		loadBundledCsv();
	</script>
</body>
</html>
